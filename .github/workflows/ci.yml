name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/complete-aegis
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  linux-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    defaults:
      run:
        working-directory: remote-control-kmp
    env:
      AEGIS_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/aegis_test
      AEGIS_TEST_POSTGRES_USER: aegis
      AEGIS_TEST_POSTGRES_PASSWORD: aegis-integration-only
      AEGIS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      AEGIS_TEST_SSHD_PATH: /usr/sbin/sshd
      AEGIS_TEST_SSH_KEYGEN_PATH: /usr/bin/ssh-keygen
      AEGIS_TEST_SSH_KEYSCAN_PATH: /usr/bin/ssh-keyscan
      AEGIS_TEST_SSH_PATH: /usr/bin/ssh
      AEGIS_TEST_SFTP_PATH: /usr/bin/sftp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Linux test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            dpkg-dev \
            file \
            libdbus-1-dev \
            libpulse0 \
            libpipewire-0.3-dev \
            openssh-client \
            openssh-server \
            pkg-config \
            rpm \
            xauth \
            xvfb
          sudo install -d -m 0755 /run/sshd
          command -v gcc
          command -v pkg-config
          command -v rpmbuild
          test -x /usr/sbin/sshd
          test -x /usr/bin/ssh
      - name: Verify JDK and Android SDK
        run: |
          java -version
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          test -d "$android_sdk"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --list >/dev/null
      - name: Run desktop, Android, relay, and pairing loopback tests under X11
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            env XDG_SESSION_TYPE=x11 WAYLAND_DISPLAY= \
            ./gradlew --no-daemon --dependency-verification strict \
              :app-desktop:desktop-agent:test \
              :app-desktop:desktop-main:test \
              :app-desktop:desktop-input:test \
              :app-desktop:desktop-clipboard:test \
              :app-desktop:desktop-webrtc:test \
              :app-android:testDebugUnitTest \
              :shared:core-pairing:jvmTest \
              :relay-server:relay-main:test \
              --stacktrace \
              --console=plain
      - name: Verify real TURN REST credential allocation
        run: |
          docker compose -f relay-server/docker-compose.integration.yml up -d --wait coturn
          bash relay-server/scripts/verify-turn-allocation.sh
      - name: Stop integration services
        if: ${{ always() }}
        run: docker compose -f relay-server/docker-compose.integration.yml down --remove-orphans
      - name: Upload Linux test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: aegis-linux-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            remote-control-kmp/**/build/test-results/**
            remote-control-kmp/**/build/reports/tests/**
            remote-control-kmp/**/build/reports/**

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: remote-control-kmp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install analysis prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            pkg-config \
            xauth \
            xvfb
      - name: Verify JDK and Android SDK
        run: |
          java -version
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          test -d "$android_sdk"
          test -x "$android_sdk/cmdline-tools/latest/bin/sdkmanager"
      - name: Run migration, lint, formatting, and static checks
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            env XDG_SESSION_TYPE=x11 WAYLAND_DISPLAY= \
            ./gradlew --no-daemon --dependency-verification strict \
              verifySqlDelightMigration \
              detekt \
              ktlintCheck \
              lintRelease \
              --max-workers=1 \
              --stacktrace \
              --console=plain
      - name: Test release bundle validation
        working-directory: .
        run: node --test .github/scripts/release.test.mjs
      - name: Upload static-analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: aegis-static-analysis-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            remote-control-kmp/**/build/reports/**
            remote-control-kmp/**/build/test-results/**

  linux-package:
    needs:
      - linux-test
      - static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: remote-control-kmp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install native packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            dpkg-dev \
            fakeroot \
            file \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            pkg-config \
            rpm
          command -v dpkg-deb
          command -v rpmbuild
          command -v jpackage
      - name: Build Linux distributable and native packages
        run: |
          ./gradlew --no-daemon --dependency-verification strict \
            :app-desktop:desktop-main:createDistributable \
            :app-desktop:desktop-main:packageDeb \
            :app-desktop:desktop-main:packageRpm \
            --stacktrace \
            --console=plain
      - name: Upload Linux packages and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: aegis-linux-package-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            remote-control-kmp/app-desktop/desktop-main/build/compose/binaries/main/app/**
            remote-control-kmp/app-desktop/desktop-main/build/compose/binaries/main/deb/**
            remote-control-kmp/app-desktop/desktop-main/build/compose/binaries/main/rpm/**
            remote-control-kmp/**/build/reports/**

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: remote-control-kmp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify JDK and Android SDK
        shell: pwsh
        run: |
          java -version
          if (-not $env:ANDROID_HOME -and -not $env:ANDROID_SDK_ROOT) { throw 'Android SDK is not available' }
      - name: Run Windows-compatible tests and lint
        shell: pwsh
        run: >-
          ./gradlew.bat --no-daemon --dependency-verification strict
          :app-desktop:desktop-agent:test
          :app-desktop:desktop-input:test
          :app-desktop:desktop-clipboard:test
          :app-desktop:desktop-webrtc:test
          :app-desktop:desktop-main:test
          :shared:core-pairing:jvmTest
          :shared:core-security:jvmTest
          :protocol:protocol-models:jvmTest
          :relay-server:relay-main:test
          :app-android:testDebugUnitTest
          detekt ktlintCheck lintRelease
          --stacktrace --console=plain
      - name: Verify SQLDelight migrations
        shell: pwsh
        run: >-
          ./gradlew.bat --no-daemon --dependency-verification strict
          verifySqlDelightMigration --stacktrace --console=plain
      - name: Build developer APK, desktop artifacts and SBOM
        shell: pwsh
        run: >-
          ./gradlew.bat --no-daemon --dependency-verification strict
          :app-android:assembleRelease
          :app-android:assembleDebug
          :app-desktop:desktop-main:createDistributable
          cyclonedxBom --stacktrace --console=plain
      - name: Verify installable development APK
        shell: pwsh
        run: |
          $apk = @(Get-ChildItem 'app-android/build/outputs/apk/debug/*.apk')
          if ($apk.Count -ne 1) { throw 'Expected exactly one development APK' }
          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools/*/apksigner.bat" | Sort-Object FullName -Descending | Select-Object -First 1
          & $apksigner.FullName verify --verbose $apk[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Development APK signature is invalid' }
          $aapt = Get-ChildItem "$env:ANDROID_HOME/build-tools/*/aapt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $badging = @(& $aapt.FullName dump badging $apk[0].FullName 2>&1)
          if ($LASTEXITCODE -ne 0 -or ($badging -join "`n") -notmatch "(?m)^package: name='dev\.aegis\.remote\.android\.dev'") {
            throw 'Development APK must use its isolated package ID'
          }
      - name: Cache bundled OpenSSH dependency
        uses: actions/cache@v4
        with:
          path: remote-control-kmp/build/packaging-dependencies
          key: openssh-win64-10.0.0.0p2-preview-23f50f34
          restore-keys: openssh-win64-
      - name: Build provisioned Windows Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'PKG-9002: Inno Setup installation failed' }
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          $openSshDir = ./tools/release/prepare-openssh.ps1
          $output = Join-Path (Get-Location) 'dist/ci-setup'
          New-Item -ItemType Directory -Force $output | Out-Null
          & $iscc '/DAppVersion=0.2.0' "/DOpenSshSourceDir=$(Join-Path (Get-Location) 'packaging/windows/openssh')" "/DBundledOpenSshDir=$openSshDir" "/O$output" 'packaging/windows/AegisRemoteDesktop.iss'
          if ($LASTEXITCODE -ne 0) { throw 'PKG-9004: provisioned Windows Setup build failed' }
      - name: Upload Windows reports and artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: aegis-windows-test-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            remote-control-kmp/app-android/build/outputs/apk/release/*.apk
            remote-control-kmp/app-android/build/outputs/apk/debug/*.apk
            remote-control-kmp/dist/ci-setup/Aegis-Remote-Desktop-Setup-*.exe
            remote-control-kmp/build/reports/cyclonedx/bom.*
            remote-control-kmp/**/build/reports/**
            remote-control-kmp/**/build/test-results/**

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Scan the checked-out source tree with Gitleaks
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1
          dir /repo --redact --no-banner

  development-release:
    needs: [linux-test, static-analysis, linux-package, windows-test, secret-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: aegis-*-artifacts
          path: release-input
      - name: Publish verified development packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: development
        run: |
          export RELEASE_TAG="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          node .github/scripts/release.mjs
